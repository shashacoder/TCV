
name: Build and Deploy TCV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcv-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Lightsail
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Package production files
        run: |
          tar -czf tcv-release.tar.gz \
            dist package.json package-lock.json

      
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "::error::LIGHTSAIL_SSH_KEY_B64 is missing"
            exit 1
          fi

          # Decode the exact original private-key bytes
          printf '%s' "$SSH_PRIVATE_KEY_B64" |
            base64 --decode > ~/.ssh/tcv_deploy

          chmod 600 ~/.ssh/tcv_deploy

          # Validate that OpenSSH can read the key
          if ! ssh-keygen -y -f ~/.ssh/tcv_deploy \
              > ~/.ssh/tcv_deploy.pub; then
            echo "::error::Decoded private key is invalid"
            exit 1
          fi

          echo "Private-key fingerprint:"
          ssh-keygen -lf ~/.ssh/tcv_deploy.pub

          # Configure verified SSH host key
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::LIGHTSAIL_KNOWN_HOSTS is missing"
            exit 1
          fi

          printf '%s\n' "$SSH_KNOWN_HOSTS" |
            tr -d '\r' > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -F "$LIGHTSAIL_HOST" \
              -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::Lightsail host key is not configured"
            exit 1
          fi

          echo "SSH configuration successfully validated."

      - name: Test Lightsail SSH authentication
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/tcv_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            "whoami"


          
      - name: Verify deployment SSH authentication
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          set -euo pipefail

          echo "Checking private key..."

          ssh-keygen -y -f ~/.ssh/tcv_deploy \
            > ~/.ssh/tcv_deploy.pub

          echo "GitHub Actions private key fingerprint:"
          ssh-keygen -lf ~/.ssh/tcv_deploy.pub

          echo "Testing Lightsail SSH authentication..."

          ssh \
            -i ~/.ssh/tcv_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            "whoami"

          echo "SSH authentication successful."



      - name: Upload application to Lightsail
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          scp \
            -i ~/.ssh/tcv_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            tcv-release.tar.gz \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}:/tmp/tcv-${GITHUB_SHA}.tar.gz"

      - name: Deploy and restart application
        shell: bash
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
        run: |
          ssh \
            -i ~/.ssh/tcv_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${LIGHTSAIL_USER}@${LIGHTSAIL_HOST}" \
            "GITHUB_SHA=${GITHUB_SHA} bash -s" <<'REMOTE'

          set -Eeuo pipefail

          RELEASE="/opt/tcv/releases/${GITHUB_SHA}"

          mkdir -p "$RELEASE"

          tar -xzf "/tmp/tcv-${GITHUB_SHA}.tar.gz" \
            -C "$RELEASE"

          cd "$RELEASE"

          npm ci --omit=dev --no-audit --no-fund

          ln -sfn "$RELEASE" /opt/tcv/current.next

          mv -Tf /opt/tcv/current.next /opt/tcv/current

          sudo /usr/bin/systemctl restart tcv

          STATUS=$(sudo /usr/bin/systemctl is-active tcv)

          test "$STATUS" = "active"

          HEALTHY=0

          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:8000/health; then

              HEALTHY=1
              echo
              echo "Application health check passed."
              break
            fi

            echo "Health check attempt ${attempt}/15 failed. Retrying in 2 seconds..."
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Application health check failed."

            sudo /usr/bin/systemctl status tcv --no-pager -l || true
            sudo /usr/bin/journalctl -u tcv -n 50 --no-pager || true

            exit 1
          fi

          rm -f "/tmp/tcv-${GITHUB_SHA}.tar.gz"
          echo "TCV deployment successful."

          REMOTE
